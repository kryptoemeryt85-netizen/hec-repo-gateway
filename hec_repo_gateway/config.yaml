name: HEC Repo Gateway
version: "0.2.3"
slug: hec_repo_gateway
description: Restricted source inspection and isolated exact Git operations
arch: [aarch64, amd64]
url: https://github.com/kryptoemeryt85-netizen/hec-repo-gateway
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
hassio_api: false
homeassistant_api: true
host_network: false
map:
  - type: homeassistant_config
    path: /homeassistant
    read_only: false
  - type: all_app_configs
    path: /addon_configs
    read_only: false
options:
  editable_paths: []
schema:
  editable_paths:
    - str
environment:
  GOODWE_WRITE: "0"
